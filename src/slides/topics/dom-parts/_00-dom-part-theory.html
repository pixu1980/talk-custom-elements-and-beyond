<section data-topic="dom-parts" data-menu-title="DOM Part theory">
  <h4 balance>What a <mark>DOM Part</mark> actually is?</h4>
  <small balance>
    A DOM Part is not a component and not even a DOM node: it's a key-valued <mark>update slot</mark> inside a rendered template, keeps a reference to the related DOM node.
  </small>
</section>
